name: Deploy tarea 4

on:
  push:
    branches: [hw-04]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-tarea4
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: t4/hw-04

    env:
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: t4/hw-04/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Comprobar identidad OIDC
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            core.setSecret(token);
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );
            core.info(`sub: ${claims.sub}`);
            core.info(`aud: ${claims.aud}`);
            core.info(`iss: ${claims.iss}`);

      - name: Autenticar en AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload a S3
        run: aws s3 sync dist/ "s3://$S3_BUCKET/" --delete

      - name: Invalidar cache de CloudFront
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"